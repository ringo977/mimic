name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
      - 'updates/**'
      - '**/*.md'
      - '**/*.rtf'
  workflow_dispatch:

# Avoid overlapping deploys; let the latest push win.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the built site to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (basePath /mimic)
        run: npm run build
        env:
          # Optional: override the hardcoded fallbacks in lib/supabase.ts.
          # Safe to leave unset — the public anon key/URL fallbacks are used.
          # Same secret names as keep-supabase-alive.yml.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to gh-pages branch
        # Third-party action pinned to commit SHA (tag v4.0.0) so a compromised
        # tag can't run arbitrary code with our repo token.
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # peaceiris adds .nojekyll automatically so the _next/ folder is served.
